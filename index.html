.hc span{color:var(--green)}
#main{position:fixed;inset:0;touch-action:none;overflow:hidden;background:#0a0806}
#ti{position:absolute;pointer-events:none;display:block;z-index:1}
.piece{position:absolute;cursor:grab;touch-action:none;filter:drop-shadow(0 3px 10px rgba(0,0,0,.85));z-index:10;-webkit-user-drag:none;will-change:transform}
.piece.dragging{filter:none;z-index:500;cursor:grabbing}
.piece.locked{cursor:default;pointer-events:none;z-index:5;filter:drop-shadow(0 1px 4px rgba(0,0,0,.6));transition:left .12s,top .12s,width .12s,height .12s}
.piece img{display:block;width:100%;height:100%;pointer-events:none;-webkit-user-drag:none}
@keyframes snapPop{0%{filter:drop-shadow(0 0 12px rgba(60,200,20,.8));transform:scale(1.05)}100%{filter:drop-shadow(0 1px 4px rgba(0,0,0,.7));transform:scale(1)}}
.piece.snap-anim{animation:snapPop .3s ease-out forwards}
#rb{position:absolute;bottom:12px;right:12px;z-index:40;font-family:'Cinzel',serif;font-size:.52rem;letter-spacing:.1em;text-transform:uppercase;padding:5px 12px;background:rgba(6,5,4,.92);border:1px solid #3a3020;color:var(--text-dim);cursor:pointer}
#rb:hover{border-color:var(--gold);color:var(--gold)}
#vic{display:none;position:fixed;inset:0;background:#000;z-index:300;overflow:hidden}
#vic.show{display:block;animation:fi .4s ease}
@keyframes fi{from{opacity:0}to{opacity:1}}
#vic-img{position:absolute;object-fit:contain;display:block}
#vic-bar{position:absolute;bottom:0;left:0;right:0;padding:14px 20px;background:linear-gradient(0deg,rgba(3,2,1,.92),transparent);text-align:center;z-index:10}

{id:'ereth_0',real:false,src:'https://fxygrfodcuwajcidkvus.supabase.co/storage/v1/object/public/puzzle-pieces/ereth_0.png',pw:180,ph:117,tx:0,ty:0,tw:0,th:0},
{id:'ereth_1',real:false,src:'https://fxygrfodcuwajcidkvus.supabase.co/storage/v1/object/public/puzzle-pieces/ereth_1.png',pw:180,ph:153,tx:0,ty:0,tw:0,th:0},
{id:'ereth_2',real:false,src:'https://fxygrfodcuwajcidkvus.supabase.co/storage/v1/object/public/puzzle-pieces/ereth_2.png',pw:170,ph:180,tx:0,ty:0,tw:0,th:0},
{id:'ereth_3',real:false,src:'https://fxygrfodcuwajcidkvus.supabase.co/storage/v1/object/public/puzzle-pieces/ereth_3.png',pw:180,ph:150,tx:0,ty:0,tw:0,th:0}
];
const REAL = 23;
const SNAP_F = 0.13;
const PIECE_H = 75;
let locked = new Set();
let drag = null;
let zTop = 100;
let myDragging = null;
let serverPos = {};
let tableR = null;

function shuffle(a) {
  for (let i = a.length-1; i > 0; i--) {
    let j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function gp(e) {
  if (e.touches && e.touches.length) return {x:e.touches[0].clientX, y:e.touches[0].clientY};
  if (e.changedTouches && e.changedTouches.length) return {x:e.changedTouches[0].clientX, y:e.changedTouches[0].clientY};
  return {x:e.clientX, y:e.clientY};
}

function layoutTable() {
  const ti = document.getElementById('ti');
  const vw = window.innerWidth, vh = window.innerHeight;
  const hdrH = document.getElementById('hdr').offsetHeight;
  const avH = vh - hdrH;
  const ar = (ti.naturalWidth && ti.naturalHeight) ? (ti.naturalWidth/ti.naturalHeight) : (800/600);
  const portrait = vw < vh;
  // On portrait phones, keep the table smaller and higher so there is a big
  // scatter band underneath for all the pieces.
  const wFrac = portrait ? 0.92 : 0.70;
  const hCap  = portrait ? 0.46 : 0.66;
  let tw = vw * wFrac, th = tw / ar;
  if (th > avH * hCap) { th = avH * hCap; tw = th * ar; }
  const tl = (vw-tw)/2;
  // Push table toward the top of the available area (leaves room below)
  const tt = hdrH + (portrait ? mgTop() : (avH-th)/2);
  ti.style.cssText = 'left:'+tl+'px;top:'+tt+'px;width:'+tw+'px;height:'+th+'px;position:absolute;pointer-events:none;display:block;z-index:1;';
  tableR = {left:tl, top:tt, width:tw, height:th};
}
function mgTop() { return Math.max(10, window.innerHeight * 0.015); }

function getTableRect() { return document.getElementById('ti').getBoundingClientRect(); }

function layoutVicMap() {
  const img = document.getElementById('vic-img');
  const vw = window.innerWidth, vh = window.innerHeight;
  if (vw < vh) {
    img.style.cssText = 'width:'+vh+'px;height:'+vw+'px;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) rotate(90deg);object-fit:contain;';
  } else {
    img.style.cssText = 'width:100%;height:100%;position:absolute;top:0;left:0;object-fit:contain;';
  }
}

function closeVic() { document.getElementById('vic').classList.remove('show'); }
function showVic() { layoutVicMap(); document.getElementById('vic').classList.add('show'); }

async function loadServerState() {
  try {
    const r = await fetch('https://fxygrfodcuwajcidkvus.supabase.co/rest/v1/piece_positions?select=*', {
      headers: {'apikey':'sb_publishable_GchPRO3iDe3oEWz0T3f1cw_ziJ_nZQM','Authorization':'Bearer sb_publishable_GchPRO3iDe3oEWz0T3f1cw_ziJ_nZQM'}
    });
    if (r.ok) {
      const rows = await r.json();
      rows.forEach(row => {
        if (row.locked) {
          locked.add(row.id);
          serverPos[row.id] = {locked:true};
        } else if (typeof row.x === 'number' && row.x >= 0 && row.x <= 1 &&
                   typeof row.y === 'number' && row.y >= 0 && row.y <= 1) {
          // Stored as fractions of the viewport -> consistent across devices.
          // Anything outside 0..1 is stale pixel data from old sessions; ignore it.
          serverPos[row.id] = {fx:row.x, fy:row.y, locked:false};
        }
      });
    }
  } catch(e) {}
}

async function sbSave(id, fx, fy, isLocked) {
  try {
    await fetch('https://fxygrfodcuwajcidkvus.supabase.co/rest/v1/piece_positions', {
      method: 'POST',
      headers: {'apikey':'sb_publishable_GchPRO3iDe3oEWz0T3f1cw_ziJ_nZQM','Authorization':'Bearer sb_publishable_GchPRO3iDe3oEWz0T3f1cw_ziJ_nZQM','Content-Type':'application/json','Prefer':'resolution=merge-duplicates'},
      body: JSON.stringify({id, x:fx, y:fy, locked:isLocked})
    });
  } catch(e) {}
}

async function sbClear() {
  try {
    await fetch('https://fxygrfodcuwajcidkvus.supabase.co/rest/v1/piece_positions?id=neq.null', {
      method: 'DELETE',
      headers: {'apikey':'sb_publishable_GchPRO3iDe3oEWz0T3f1cw_ziJ_nZQM','Authorization':'Bearer sb_publishable_GchPRO3iDe3oEWz0T3f1cw_ziJ_nZQM'}
    });
  } catch(e) {}
}

function setupRealtime() {
  ch = sb.channel('puzzle:main', {config:{broadcast:{self:false}}});
  ch.on('broadcast', {event:'move'}, (msg) => {
    const d = msg.payload;
    if (d.id === myDragging) return;
    const el = document.getElementById('el-'+d.id);
    if (!el || el.classList.contains('locked')) return;
    if (d.locked) {
      const piece = PIECES.find(p => p.id === d.id);
      if (piece && piece.real) remoteLock(el, piece);
    } else {
      el.style.left = (d.x * window.innerWidth) + 'px';
      el.style.top  = (d.y * window.innerHeight) + 'px';
    }
  });
  ch.subscribe();
}

function remoteLock(el, piece) {
  if (locked.has(piece.id)) return;
  locked.add(piece.id);
  const tr = getTableRect();
  const tx = tr.left + piece.tx*tr.width;
  const ty = tr.top  + piece.ty*tr.height;
  const tw = piece.tw*tr.width;
  const th = piece.th*tr.height;
  el.style.left=tx+'px'; el.style.top=ty+'px';
  el.style.width=tw+'px'; el.style.height=th+'px';
  el.classList.add('locked','snap-anim'); el.style.zIndex=5;
  document.getElementById('cnt').textContent = locked.size;
  if (locked.size >= REAL) setTimeout(showVic, 700);
}

function placePieces() {
  document.getElementById('main').querySelectorAll('.piece').forEach(e=>e.remove());
  const vw = window.innerWidth, vh = window.innerHeight;
  const hdrH = document.getElementById('hdr').offsetHeight;
  const tr = tableR, mg = 8;

  const order = shuffle([...PIECES]);

  // Reference scale: how many screen px a real piece's natural pixel maps to,
  // so decoy pieces (no table coords) can be sized to match the real ones.
  let ref = 0;
  for (const p of order) {
    if (p.real && p.tw > 0) { ref = (p.tw * tr.width) / p.pw; break; }
  }
  if (!ref) ref = (tr.width * 0.18) / 200;

  // Full-size = the size the piece will be when locked onto the table.
  function fullSize(piece) {
    if (piece.real && piece.tw > 0) {
      return { w: piece.tw * tr.width, h: piece.th * tr.height };
    }
    return { w: piece.pw * ref, h: piece.ph * ref };
  }

  order.forEach((piece) => {
    const el = document.createElement('div');
    el.className = 'piece'; el.id = 'el-'+piece.id;
    el.dataset.id = piece.id; el.dataset.real = piece.real;
    const img = document.createElement('img');
    img.src = piece.src; img.alt = ''; img.loading = 'lazy';
    el.appendChild(img);

    const fs = fullSize(piece);
    const pw = Math.round(fs.w), ph = Math.round(fs.h);
    el.style.width = pw+'px'; el.style.height = ph+'px'; el.style.zIndex = ++zTop;

    // Scatter full-size pieces anywhere on screen; overlap is fine.
    let x = mg + Math.random() * Math.max(2, vw - pw - mg*2);
    let y = hdrH + mg + Math.random() * Math.max(2, vh - hdrH - ph - mg*2);

    const srv = serverPos[piece.id];
    // A piece someone already moved (but not locked) is restored from its
    // fractional position so every device shows it in the same place.
    if (srv && !srv.locked && srv.fx != null) {
      x = Math.max(mg, Math.min(vw-pw-mg, srv.fx * vw));
      y = Math.max(hdrH+mg, Math.min(vh-ph-mg, srv.fy * vh));
    }
    el.style.left = x+'px'; el.style.top = y+'px';

    if (srv && srv.locked && piece.real) {
      el.style.left = (tableR.left + piece.tx*tableR.width)+'px';
      el.style.top  = (tableR.top  + piece.ty*tableR.height)+'px';
      el.style.width = (piece.tw*tableR.width)+'px';
      el.style.height = (piece.th*tableR.height)+'px';
      el.classList.add('locked'); el.style.zIndex=5;
    } else {
      makeDraggable(el, piece);
    }
    document.getElementById('main').appendChild(el);
  });
  document.getElementById('cnt').textContent = locked.size;
}

function makeDraggable(el, piece) {
  el.addEventListener('mousedown', e => startDrag(e,el,piece));
  el.addEventListener('touchstart', e => startDrag(e,el,piece), {passive:false});
}

function startDrag(e, el, piece) {
  if (locked.has(piece.id)) return;
  e.preventDefault(); e.stopPropagation();
  const pos = gp(e);
  myDragging = piece.id;
  el.classList.add('dragging'); el.style.zIndex = ++zTop;
  drag = {el, piece, sx:pos.x, sy:pos.y, sl:el.offsetLeft, st:el.offsetTop};
  document.addEventListener('mousemove', onMove, {passive:false});
  document.addEventListener('touchmove', onMove, {passive:false});
  document.addEventListener('mouseup', onEnd);
  document.addEventListener('touchend', onEnd);
}

function onMove(e) {
  if (!drag) return; e.preventDefault();
  const pos = gp(e);
  drag.el.style.left = (drag.sl + (pos.x-drag.sx)) + 'px';
  drag.el.style.top  = (drag.st + (pos.y-drag.sy)) + 'px';
}

function onEnd() {
  if (!drag) return;
  document.removeEventListener('mousemove', onMove);
  document.removeEventListener('touchmove', onMove);
  document.removeEventListener('mouseup', onEnd);
  document.removeEventListener('touchend', onEnd);
  const {el, piece} = drag; drag = null; myDragging = null;
  el.classList.remove('dragging');
  const snapped = piece.real && trySnap(el, piece);
  if (!snapped) {
    const fx = el.offsetLeft / window.innerWidth;
    const fy = el.offsetTop / window.innerHeight;
    sbSave(piece.id, fx, fy, false);
    if (ch) ch.send({type:'broadcast', event:'move', payload:{id:piece.id, x:fx, y:fy, locked:false}});
  }
}

function trySnap(el, piece) {
  if (locked.has(piece.id)) return true;
  const tr = getTableRect(), sd = tr.width * SNAP_F;
  const tx = tr.left + piece.tx*tr.width;
  const ty = tr.top  + piece.ty*tr.height;
  const tw = piece.tw*tr.width, th = piece.th*tr.height;
  const er = el.getBoundingClientRect();
  const dist = Math.hypot(er.left+er.width/2-(tx+tw/2), er.top+er.height/2-(ty+th/2));
  if (dist < sd) {
    locked.add(piece.id);
    el.style.left=tx+'px'; el.style.top=ty+'px';
    el.style.width=tw+'px'; el.style.height=th+'px';
    el.classList.add('locked','snap-anim'); el.style.zIndex=5;
    document.getElementById('cnt').textContent = locked.size;
    sbSave(piece.id, 0, 0, true);
    if (ch) ch.send({type:'broadcast', event:'move', payload:{id:piece.id, x:0, y:0, locked:true}});
    if (locked.size >= REAL) setTimeout(showVic, 700);
    return true;
  }
  return false;
}

async function reset() {
  if (!confirm('Reset for everyone?')) return;
  locked.clear(); drag=null; zTop=100; myDragging=null; serverPos={};
  document.getElementById('cnt').textContent = 0;
  document.getElementById('vic').classList.remove('show');
  await sbClear();
  placePieces();
}
window.reset = reset;

const ti = document.getElementById('ti');
async function init() {
  layoutTable();
  await loadServerState();
  placePieces();
  setupRealtime();
}
ti.onload = init;
if (ti.complete && ti.naturalWidth > 0) init();

window.addEventListener('resize', () => {
  layoutTable();
  placePieces();
  if (document.getElementById('vic').classList.contains('show')) layoutVicMap();
});
</script>
</body>
</html>
