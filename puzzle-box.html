<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

body{background:#050402;min-height:100vh;font-family:'Crimson Text',Georgia,serif;color:var(--text);overflow:hidden;touch-action:none}
#canvas{position:fixed;inset:0;width:100vw;height:100vh;overflow:hidden;touch-action:none}
#table-img{position:absolute;left:12%;top:10%;width:76%;height:80%;object-fit:fill;pointer-events:none;z-index:1}
.hdr{position:absolute;top:0;left:0;right:0;z-index:20;text-align:center;padding:6px 12px 4px;background:linear-gradient(180deg,rgba(3,2,1,.92) 0%,transparent 100%);pointer-events:none}
.hdr-title{font-family:'UnifrakturMaguntia',cursive;font-size:clamp(1.2rem,4vw,2rem);color:var(--gold);text-shadow:0 0 16px rgba(200,146,42,.5);line-height:1}
.hdr-sub{font-size:.75rem;font-style:italic;color:var(--text-dim);line-height:1.4;margin-top:2px}
.snap-count{font-family:'Cinzel',serif;font-size:.6rem;letter-spacing:.15em;color:var(--text-dim);text-transform:uppercase;margin-top:3px}
.snap-count span{color:var(--green)}
.sync-dot{position:absolute;top:8px;right:12px;width:8px;height:8px;border-radius:50%;background:#555;z-index:30;transition:background .3s}
.sync-dot.synced{background:var(--green)}
.sync-dot.syncing{background:var(--gold)}
.map-piece{position:absolute;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;filter:drop-shadow(0 3px 8px rgba(0,0,0,.85));z-index:10}
.map-piece:active{cursor:grabbing}
.map-piece.dragging{filter:drop-shadow(0 6px 16px rgba(0,0,0,.9));z-index:200}
.map-piece.locked{cursor:default;pointer-events:none;z-index:5;filter:drop-shadow(0 1px 3px rgba(0,0,0,.6))}
.map-piece img{display:block;width:100%;height:100%;pointer-events:none;-webkit-user-drag:none}
.snap-zone{position:absolute;pointer-events:none;z-index:2}
@keyframes snapFlash{0%{filter:drop-shadow(0 0 6px rgba(60,200,20,.5))}100%{filter:drop-shadow(0 1px 3px rgba(0,0,0,.6))}}
.map-piece.snap-anim{animation:snapFlash .4s ease-out forwards}
.reset-btn{position:absolute;bottom:10px;right:12px;z-index:30;font-family:'Cinzel',serif;font-size:.6rem;letter-spacing:.12em;text-transform:uppercase;padding:6px 14px;background:rgba(6,5,4,.9);border:1px solid #3a3020;color:var(--text-dim);cursor:pointer}
.reset-btn:hover{border-color:var(--gold);color:var(--gold)}
.vic-overlay{display:none;position:fixed;inset:0;background:rgba(3,2,1,.97);align-items:center;justify-content:center;z-index:100}
.vic-overlay.show{display:flex;animation:fi .5s ease}
@keyframes fi{from{opacity:0}to{opacity:1}}
.vic-box{text-align:center;max-width:600px;padding:24px 20px;animation:ru .6s ease}
@keyframes ru{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.vic-title{font-family:'UnifrakturMaguntia',cursive;font-size:clamp(2rem,7vw,3rem);color:var(--gold-bright);text-shadow:0 0 30px rgba(200,146,42,.7);margin-bottom:12px}
.vic-map{width:100%;max-width:520px;border:2px solid var(--gold);margin:16px auto;display:block;box-shadow:0 0 30px rgba(200,146,42,.4)}
.vic-flavor{font-style:italic;color:var(--text-dim);font-size:1rem;line-height:1.75;margin-bottom:20px}
.vic-btn{font-family:'Cinzel',serif;font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;padding:10px 26px;background:transparent;border:1px solid var(--gold);color:var(--gold);cursor:pointer}

async function buildTable(){
  const canvas=document.getElementById('canvas');
  canvas.querySelectorAll('.map-piece,.snap-zone').forEach(el=>el.remove());
  snappedCount=0; document.getElementById('snap-count').textContent=0;
  const tableImg=document.getElementById('table-img');
  if(!tableImg.complete) await new Promise(r=>tableImg.onload=r);
  const vw=window.innerWidth, vh=window.innerHeight, tr=getTableRect();
  const maxPW=tr.width*0.18;

  PIECES.filter(p=>p.real).forEach(p=>{
    const zone=document.createElement('div');
    zone.className='snap-zone'; zone.id='zone-'+p.id;
    zone.style.left=(tr.left+p.tx*tr.width)+'px';
    zone.style.top=(tr.top+p.ty*tr.height)+'px';
    zone.style.width=(p.tw*tr.width)+'px';
    zone.style.height=(p.th*tr.height)+'px';
    canvas.appendChild(zone);
  });

  setSyncDot('syncing');
  const serverRows=await sbGet();
  const serverMap={};
  serverRows.forEach(r=>serverMap[r.id]=r);

  const shuffled=shuffle([...PIECES]);
  const sides=shuffled.map((piece,i)=>({piece,side:i%4}));
  sides.forEach(item=>{
    const piece=item.piece;
    const scale=maxPW/piece.pw;
    const pw=Math.round(piece.pw*scale), ph=Math.round(piece.ph*scale);
    const sideItems=sides.filter(s=>s.side===item.side);
    const sideIdx=sideItems.indexOf(item), sideCount=sideItems.length;
    const margin=6, jitter=()=>(Math.random()-0.5)*20;
    let x,y;
    if(item.side===0){ x=(vw/(sideCount+1))*(sideIdx+1)-pw/2+jitter(); y=Math.max(margin,tr.top-ph-10-Math.random()*20); }
    else if(item.side===1){ x=Math.min(vw-pw-margin,tr.right+8+Math.random()*15); y=(vh/(sideCount+1))*(sideIdx+1)-ph/2+jitter(); }
    else if(item.side===2){ x=(vw/(sideCount+1))*(sideIdx+1)-pw/2+jitter(); y=Math.min(vh-ph-margin,tr.bottom+8+Math.random()*15); }
    else{ x=Math.max(margin,tr.left-pw-8-Math.random()*15); y=(vh/(sideCount+1))*(sideIdx+1)-ph/2+jitter(); }
    x=Math.max(margin,Math.min(vw-pw-margin,x));
    y=Math.max(margin,Math.min(vh-ph-margin,y));
    const srv=serverMap[piece.id];
    if(srv){ x=srv.x; y=srv.y; }
    const el=document.createElement('div');
    el.className='map-piece'; el.id='piece-'+piece.id;
    el.dataset.pieceId=piece.id; el.dataset.real=piece.real;
    el.style.width=pw+'px'; el.style.height=ph+'px';
    el.style.left=x+'px'; el.style.top=y+'px';
    el.style.zIndex=++zTop;
    const img=document.createElement('img');
    img.src=piece.src; img.alt=''; img.loading='lazy';
    el.appendChild(img);
    if(srv&&srv.locked&&piece.real){ lockPiece(el,piece,tr,false); }
    else{ makeDraggable(el,canvas); }
    canvas.appendChild(el);
  });
  setSyncDot('synced');
  setupRealtime();
}

function makeDraggable(el,canvas){
  let startX,startY,startLeft,startTop,isDragging=false;
  function getPos(e){ if(e.touches) return {x:e.touches[0].clientX,y:e.touches[0].clientY}; return {x:e.clientX,y:e.clientY}; }
  function onStart(e){
    if(el.classList.contains('locked')) return;
    e.preventDefault(); isDragging=true; myDragging=el.dataset.pieceId;
    const pos=getPos(e); startX=pos.x; startY=pos.y; startLeft=el.offsetLeft; startTop=el.offsetTop;
    el.classList.add('dragging'); el.style.zIndex=++zTop;
    document.addEventListener('mousemove',onMove,{passive:false});
    document.addEventListener('touchmove',onMove,{passive:false});
    document.addEventListener('mouseup',onEnd);
    document.addEventListener('touchend',onEnd);
  }
  function onMove(e){
    if(!isDragging) return; e.preventDefault();
    const pos=getPos(e);
    el.style.left=Math.max(0,startLeft+(pos.x-startX))+'px';
    el.style.top=Math.max(0,startTop+(pos.y-startY))+'px';
  }
  async function onEnd(){
    if(!isDragging) return; isDragging=false; myDragging=null;
    el.classList.remove('dragging');
    let snapped=false;
    if(el.dataset.real==='true'){
      const piece=PIECES.find(p=>p.id===el.dataset.pieceId);
      snapped=trySnap(el,piece);
    }
    const move={id:el.dataset.pieceId,x:el.offsetLeft,y:el.offsetTop,width:el.offsetWidth,height:el.offsetHeight,locked:snapped};
    setSyncDot('syncing');
    await sbUpsert(move);
    if(channel) channel.send({type:'broadcast',event:'move',payload:move});
    setSyncDot('synced');
    document.removeEventListener('mousemove',onMove);
    document.removeEventListener('touchmove',onMove);
    document.removeEventListener('mouseup',onEnd);
    document.removeEventListener('touchend',onEnd);
  }
  el.addEventListener('mousedown',onStart);
  el.addEventListener('touchstart',onStart,{passive:false});
}

function trySnap(el,piece){
  if(!piece||!piece.real) return false;
  const tr=getTableRect(), snapDist=tr.width*SNAP_DIST_FACTOR;
  const tx=tr.left+piece.tx*tr.width, ty=tr.top+piece.ty*tr.height;
  const tw=piece.tw*tr.width, th=piece.th*tr.height;
  const pCX=el.offsetLeft+el.offsetWidth/2, pCY=el.offsetTop+el.offsetHeight/2;
  const dist=Math.sqrt((pCX-(tx+tw/2))**2+(pCY-(ty+th/2))**2);
  if(dist<snapDist){ lockPiece(el,piece,tr,true); return true; }
  return false;
}

function lockPiece(el,piece,tr,animate){
  if(!tr) tr=getTableRect();
  const p=PIECES.find(x=>x.id===piece.id)||piece;
  const tx=tr.left+p.tx*tr.width, ty=tr.top+p.ty*tr.height;
  const tw=p.tw*tr.width, th=p.th*tr.height;
  el.style.left=tx+'px'; el.style.top=ty+'px';
  el.style.width=tw+'px'; el.style.height=th+'px';
  el.classList.add('locked');
  if(animate) el.classList.add('snap-anim');
  el.style.zIndex=5;
  snappedCount++;
  document.getElementById('snap-count').textContent=snappedCount;
  if(snappedCount>=TOTAL_REAL) setTimeout(()=>document.getElementById('victory').classList.add('show'),600);
}

function setupRealtime(){
  channel=supabase.channel('puzzle:main',{config:{broadcast:{self:false}}});
  channel.on('broadcast',{event:'move'},(msg)=>{
    const pld=msg.payload;
    if(pld.id===myDragging) return;
    const el=document.getElementById('piece-'+pld.id);
    if(!el||el.classList.contains('locked')) return;
    if(pld.locked){
      const piece=PIECES.find(p=>p.id===pld.id);
      if(piece&&piece.real) lockPiece(el,piece,null,true);
    } else {
      el.style.left=pld.x+'px';
      el.style.top=pld.y+'px';
    }
  });
  channel.subscribe(status=>{
    if(status==='SUBSCRIBED') setSyncDot('synced');
  });
}

async function resetTable(){
  if(!confirm('Reset the table for everyone?')) return;
  if(channel) await supabase.removeChannel(channel);
  setSyncDot('syncing');
  await sbDeleteAll();
  buildTable();
}

window.resetTable = resetTable;
buildTable();
window.addEventListener('resize',()=>buildTable());

</script>
